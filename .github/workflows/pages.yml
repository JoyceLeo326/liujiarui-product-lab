name: Verify and publish portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Reject accidental secrets and remote runtime assets
        shell: bash
        run: |
          if git grep -nEI '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|(DEEPSEEK|OPENAI|ANTHROPIC|BAIDU).{0,20}(API_KEY|SECRET).{0,5}[:=].{0,5}[^$<{[:space:]]{8,})' -- ':!README.md'; then
            echo 'Potential credential found'
            exit 1
          fi
          if git grep -nEI 'fonts\.googleapis|gstatic|unpkg|jsdelivr|cdnjs' -- '*.html' '*.css' '*.js'; then
            echo 'Remote runtime asset found'
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
